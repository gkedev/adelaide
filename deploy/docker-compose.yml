services:
  chipin:
    build: ./src
    image: chipin:latest
    pull_policy: build
    container_name: chipin
    restart: always
    environment:
      CHIPIN_ORIGIN: https://chipin.aauth.tech
      CHIPIN_PS: https://person.hello.coop
      CHIPIN_PAY: ${CHIPIN_PAY}
      CHIPIN_MAX_ORDER: ${CHIPIN_MAX_ORDER}
      CHIPIN_ENROLLMENT_SECRET: ${CHIPIN_ENROLLMENT_SECRET}
      CHIPIN_BB_API_KEY: ${CHIPIN_BB_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      KEYCARD_CLIENT_ID: ${KEYCARD_CLIENT_ID}
      KEYCARD_CLIENT_SECRET: ${KEYCARD_CLIENT_SECRET}
      KEYCARD_ZONE_ID: ${KEYCARD_ZONE_ID}
    networks:
      - app-net
    volumes:
      - ./public:/app/public:ro
      - ./data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=app-net"
      - "traefik.http.routers.chipin.rule=Host(`chipin.aauth.tech`)"
      - "traefik.http.routers.chipin.entrypoints=websecure"
      - "traefik.http.routers.chipin.tls.certresolver=letsencrypt"
      - "traefik.http.services.chipin.loadbalancer.server.port=8080"

networks:
  app-net:
    external: true
